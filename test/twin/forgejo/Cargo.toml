[package]
name = "twin-forgejo"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
description = "Fake Forgejo API server for local black-box testing"

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
fabro-forgejo = { path = "../../../lib/components/fabro-forgejo", features = ["test-support"] }
fabro-http.workspace = true
fabro-types = { path = "../../../lib/foundation/fabro-types" }
tokio = { workspace = true, features = ["test-util", "macros"] }
