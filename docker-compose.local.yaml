services:
  fabro:
    image: fabro-sh/fabro
    restart: unless-stopped
    ports:
      - "32276:32276"
    volumes:
      - fabro-storage:/storage
      - /var/run/docker.sock:/var/run/docker.sock

  # Free, local web search for the `web_search` agent tool. Start with:
  #   docker compose -f docker-compose.local.yaml --profile search up -d
  # Then point Fabro at it:
  #   fabro secret set SEARXNG_URL http://searxng:8080
  searxng:
    image: docker.io/searxng/searxng:latest
    profiles: ["search"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro

volumes:
  fabro-storage:
